name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # NOTE: This uses Trusted Publishing. You must configure this repository
        # in your PyPI account settings (Publishing -> Add a new publisher).
        # Alternatively, if you use an API token, uncomment below and add PYPI_API_TOKEN secret:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
